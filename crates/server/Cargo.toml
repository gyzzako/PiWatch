[package]
name = "PiWatch"
version = "0.1.0"
edition = "2024"

[dependencies]
core_watch = { path = "../core" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dashmap = "6"
reqwest = { version = "0.13", features = ["json"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
rand = "0.9"
hex = "0.4"
pbkdf2 = "0.12"
base64 = "0.22"
subtle = "2"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite"] }
thiserror = "1"
async-trait = "0.1"

[[bin]]
name = "PiWatch"
path = "src/main.rs"

[profile.release]
strip = true
lto = true
codegen-units = 1
